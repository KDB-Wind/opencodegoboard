[package]
name = "opencodegoboard"
version = "1.3.1"
description = "OpenCode Go local quota and usage dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
futures = "0.3"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
